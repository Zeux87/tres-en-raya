name: Compilar y publicar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pruebas de la lógica del juego
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node herramientas/pruebas.js && node herramientas/pruebas-flota.js && node herramientas/pruebas-conecta4.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar clave de firma
        env:
          FIRMA_ALMACEN_BASE64: ${{ secrets.FIRMA_ALMACEN_BASE64 }}
        run: |
          if [ -z "$FIRMA_ALMACEN_BASE64" ]; then
            echo "::error::Falta el secret FIRMA_ALMACEN_BASE64; no se publica un APK sin firmar"
            exit 1
          fi
          echo "$FIRMA_ALMACEN_BASE64" | base64 -d > "$RUNNER_TEMP/firma.jks"
          echo "FIRMA_ALMACEN=$RUNNER_TEMP/firma.jks" >> "$GITHUB_ENV"

      - name: Compilar APK
        env:
          FIRMA_CLAVE_ALMACEN: ${{ secrets.FIRMA_CLAVE_ALMACEN }}
          FIRMA_ALIAS: ${{ secrets.FIRMA_ALIAS }}
          FIRMA_CLAVE: ${{ secrets.FIRMA_CLAVE }}
        run: gradle --no-daemon assembleRelease -PcodigoVersion=${{ github.run_number }}

      - name: Borrar clave de firma
        if: always()
        run: rm -f "$RUNNER_TEMP/firma.jks"

      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk tres-en-raya.apk

      - name: Publicar versión
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Versión 1.0.${{ github.run_number }}
          body: ${{ github.event.head_commit.message || 'Compilación manual' }}
          files: tres-en-raya.apk
          make_latest: true
