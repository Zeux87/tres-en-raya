name: Compilar y publicar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pruebas de la lógica del juego
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node herramientas/pruebas.js && node herramientas/pruebas-flota.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle --no-daemon assembleRelease -PcodigoVersion=${{ github.run_number }}

      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk tres-en-raya.apk

      - name: Publicar versión
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Versión 1.0.${{ github.run_number }}
          body: ${{ github.event.head_commit.message || 'Compilación manual' }}
          files: tres-en-raya.apk
          make_latest: true
