<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Simón dice</title>
<link rel="stylesheet" href="comun.css">
<style>
  :root {
    --c0: #2fa35a; --c0-luz: #6ff2a0;
    --c1: #d9434f; --c1-luz: #ff8f98;
    --c2: #e0b020; --c2-luz: #ffe57a;
    --c3: #2f6fd6; --c3-luz: #8fbaff;
    --centro: #2b2733;
  }
  @media (prefers-color-scheme: dark) {
    :root { --c0: #24804a; --c1: #b0323d; --c2: #b38b12; --c3: #2457ad; --centro: #0f0e14; }
  }
  .panel { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .dato { background: var(--tarjeta); border-radius: 14px; padding: 8px 10px; text-align: center; box-shadow: var(--sombra); }
  .dato .nombre { font-size: 12px; color: var(--suave); font-weight: 600; }
  .dato .valor { font-size: 24px; font-weight: 800; line-height: 1.2; }
  .simon {
    position: relative;
    width: 100%;
    max-width: 360px;
    aspect-ratio: 1;
    margin: 4px auto 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 10px;
    border-radius: 50%;
    background: var(--centro);
    box-shadow: var(--sombra);
    touch-action: manipulation;
  }
  .tecla { border: 0; padding: 0; opacity: .82; transition: background .08s, opacity .08s, transform .08s; }
  .tecla[data-c="0"] { background: var(--c0); border-radius: 100% 8px 8px 8px; }
  .tecla[data-c="1"] { background: var(--c1); border-radius: 8px 100% 8px 8px; }
  .tecla[data-c="2"] { background: var(--c2); border-radius: 8px 8px 8px 100%; }
  .tecla[data-c="3"] { background: var(--c3); border-radius: 8px 8px 100% 8px; }
  .tecla.luz { opacity: 1; transform: scale(.97); }
  .tecla[data-c="0"].luz { background: var(--c0-luz); box-shadow: 0 0 30px var(--c0-luz); }
  .tecla[data-c="1"].luz { background: var(--c1-luz); box-shadow: 0 0 30px var(--c1-luz); }
  .tecla[data-c="2"].luz { background: var(--c2-luz); box-shadow: 0 0 30px var(--c2-luz); }
  .tecla[data-c="3"].luz { background: var(--c3-luz); box-shadow: 0 0 30px var(--c3-luz); }
  .centro {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 38%;
    height: 38%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: var(--centro);
    border: 0;
    color: #fff;
    font: inherit;
    font-weight: 800;
    font-size: 17px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
  }
  .centro .num { font-size: 34px; line-height: 1; }
  .centro small { font-size: 11px; opacity: .7; font-weight: 600; }
  .simon.fallo { animation: tiembla .4s; }
  @keyframes tiembla { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }

  /* Que el tablero no se encoja si la pantalla es baja */
  .simon { flex: none; }
</style>
</head>
<body>
<main>
  <div class="barra">
    <a class="volver" href="index.html">‹ Menú</a>
    <h1>Simón dice</h1>
    <span></span>
  </div>

  <div class="segmentos" id="niveles">
    <button data-valor="lento">Lento</button>
    <button data-valor="normal">Normal</button>
    <button data-valor="rapido">Rápido</button>
  </div>

  <div class="panel">
    <div class="dato"><div class="nombre">Rondas</div><div class="valor" id="puntos">0</div></div>
    <div class="dato"><div class="nombre">Récord</div><div class="valor" id="record">0</div></div>
  </div>

  <div class="estado" id="estado">Mira, escucha y repite</div>

  <div class="simon" id="simon">
    <button class="tecla" data-c="0" aria-label="Verde"></button>
    <button class="tecla" data-c="1" aria-label="Rojo"></button>
    <button class="tecla" data-c="2" aria-label="Amarillo"></button>
    <button class="tecla" data-c="3" aria-label="Azul"></button>
    <button class="centro" id="centro"><span class="num" id="centroNum">▶</span><small id="centroTexto">Empezar</small></button>
  </div>

  <div class="segmentos" id="sonido">
    <button data-valor="si">🔊 Con sonido</button>
    <button data-valor="no">🔇 Sin sonido</button>
  </div>
</main>

<script src="plataforma.js"></script>
<script src="simon.js"></script>
<script src="simon-interfaz.js"></script>
</body>
</html>
