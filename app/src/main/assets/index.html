<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Juegos</title>
<link rel="stylesheet" href="comun.css">
<style>
  h1 { margin-top: 18px; font-size: 32px; }
  .subtitulo { text-align: center; color: var(--suave); margin: -6px 0 8px; }
  .juego {
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--tarjeta);
    border-radius: 20px;
    padding: 18px;
    box-shadow: var(--sombra);
    color: var(--texto);
    text-decoration: none;
    transition: transform .1s;
  }
  .juego:active { transform: scale(.98); }
  .juego svg { width: 76px; height: 76px; flex: none; border-radius: 18px; }
  .juego .titulo { font-size: 20px; font-weight: 800; }
  .juego .texto { font-size: 14px; color: var(--suave); margin-top: 3px; line-height: 1.35; }
  .juego .pendiente { color: var(--acento); font-weight: 700; }
</style>
</head>
<body>
<main>
  <h1>Juegos</h1>
  <p class="subtitulo">Elige a qué jugar</p>

  <a class="juego" href="tresenraya.html">
    <svg viewBox="0 0 76 76" aria-hidden="true">
      <rect width="76" height="76" fill="#4b3fd6"/>
      <path d="M31 16v44M45 16v44M16 31h44M16 45h44" stroke="#fff" stroke-opacity=".55" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M19 19l8 8M27 19l-8 8M34 34l8 8M42 34l-8 8M49 49l8 8M57 49l-8 8" stroke="#ff7a7a" stroke-width="3.2" stroke-linecap="round"/>
      <circle cx="53" cy="23" r="4.6" fill="none" stroke="#4fe0d3" stroke-width="3"/>
      <circle cx="23" cy="53" r="4.6" fill="none" stroke="#4fe0d3" stroke-width="3"/>
    </svg>
    <div>
      <div class="titulo">3 en raya</div>
      <div class="texto">Contra el móvil (3 niveles) o a dos jugadores</div>
    </div>
  </a>

  <a class="juego" href="flota.html">
    <svg viewBox="0 0 76 76" aria-hidden="true">
      <rect width="76" height="76" fill="#1d5f9e"/>
      <path d="M8 52c6 0 6-4 12-4s6 4 12 4 6-4 12-4 6 4 12 4 6-4 12-4" fill="none" stroke="#9fd3ff" stroke-width="3" stroke-linecap="round"/>
      <path d="M14 40h46l-7 9H22z" fill="#e8eef6"/>
      <rect x="28" y="30" width="16" height="10" rx="2" fill="#e8eef6"/>
      <rect x="34" y="22" width="4" height="9" fill="#e8eef6"/>
      <circle cx="58" cy="20" r="6" fill="#ff6b6b"/>
      <path d="M54 16l8 8M62 16l-8 8" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <div>
      <div class="titulo">Hundir la flota</div>
      <div class="texto">2 jugadores en el mismo móvil<span id="pendiente"></span></div>
    </div>
  </a>

  <footer id="pie"></footer>
</main>
<script>
  (function () {
    'use strict';
    // Aviso si hay una partida de la flota a medias
    try {
      var p = JSON.parse(localStorage.getItem('flota.partida'));
      if (p && p.fase && p.fase !== 'inicio' && p.fase !== 'fin') {
        var s = document.getElementById('pendiente');
        s.className = 'pendiente';
        s.textContent = ' · partida a medias';
      }
    } catch (e) { /* nada */ }

    var Android = window.Android;
    if (Android && Android.version) {
      var pie = document.getElementById('pie');
      var v = document.createElement('span');
      v.textContent = 'Versión ' + Android.version() + ' · ';
      var b = document.createElement('button');
      b.textContent = 'Buscar actualizaciones';
      b.addEventListener('click', function () { Android.buscarActualizacion(); });
      pie.appendChild(v);
      pie.appendChild(b);
    }
  })();
</script>
</body>
</html>
