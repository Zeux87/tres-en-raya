<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Juegos</title>
<link rel="stylesheet" href="comun.css">
<style>
  h1 { margin-top: 18px; font-size: 32px; }
  .subtitulo { text-align: center; color: var(--suave); margin: -6px 0 8px; }
  #juegos { display: flex; flex-direction: column; gap: 14px; }
  .juego {
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--tarjeta);
    border-radius: 20px;
    padding: 18px;
    box-shadow: var(--sombra);
    color: var(--texto);
    text-decoration: none;
    transition: transform .1s;
  }
  .juego:active { transform: scale(.98); }
  .juego svg { width: 76px; height: 76px; flex: none; border-radius: 18px; }
  .juego .titulo { font-size: 20px; font-weight: 800; }
  .juego .texto { font-size: 14px; color: var(--suave); margin-top: 3px; line-height: 1.35; }
  .juego .pendiente { color: var(--acento); font-weight: 700; }
</style>
</head>
<body>
<main>
  <h1>Juegos</h1>
  <p class="subtitulo">Elige a qué jugar</p>

  <nav id="juegos"></nav>

  <footer id="pie"></footer>
</main>
<script src="plataforma.js"></script>
<script src="juegos.js"></script>
<script>
  (function () {
    'use strict';
    // Tarjetas del menú a partir de la lista de juegos (juegos.js)
    var nav = document.getElementById('juegos');
    function pintarMenu() {
      nav.innerHTML = '';
      window.JUEGOS.forEach(function (j) {
        var a = document.createElement('a');
        a.className = 'juego';
        a.href = j.pagina;
        a.innerHTML = '<svg viewBox="0 0 76 76" aria-hidden="true">' + j.icono + '</svg>';
        var div = document.createElement('div');
        var t = document.createElement('div');
        t.className = 'titulo';
        t.textContent = j.titulo;
        var x = document.createElement('div');
        x.className = 'texto';
        x.textContent = j.texto;
        if (Plataforma.enCurso(j.id)) {
          var p = document.createElement('span');
          p.className = 'pendiente';
          p.textContent = ' · partida a medias';
          x.appendChild(p);
        }
        div.appendChild(t);
        div.appendChild(x);
        a.appendChild(div);
        nav.appendChild(a);
      });
    }
    pintarMenu();
    // Al volver con "atrás" la página puede salir de la caché: refrescar avisos
    window.addEventListener('pageshow', function (e) { if (e.persisted) pintarMenu(); });

    var Android = window.Android;
    if (Android && Android.version) {
      var pie = document.getElementById('pie');
      var v = document.createElement('span');
      v.textContent = 'Versión ' + Android.version() + ' · ';
      var b = document.createElement('button');
      b.textContent = 'Buscar actualizaciones';
      b.addEventListener('click', function () { Android.buscarActualizacion(); });
      pie.appendChild(v);
      pie.appendChild(b);
    }
  })();
</script>
</body>
</html>
