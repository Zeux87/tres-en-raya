<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Damas</title>
<link rel="stylesheet" href="comun.css">
<style>
  :root {
    --clara: #f0d9b5;
    --oscura: #a8754f;
    --marco: #6e4529;
    --blanca: #fbf8f2;
    --negra: #2b2733;
    --sel: #f5bd2e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --clara: #b89a76; --oscura: #6f4b31; --marco: #3e2617; --negra: #141218; }
  }
  .tablero {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    border: 6px solid var(--marco);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: var(--sombra);
    touch-action: manipulation;
  }
  .tablero.girado { transform: rotate(180deg); }
  .casilla { aspect-ratio: 1; position: relative; background: var(--clara); }
  .casilla.oscura { background: var(--oscura); }
  .casilla.camino { box-shadow: inset 0 0 0 100px rgba(245, 189, 46, .28); }
  .pieza {
    position: absolute;
    inset: 11%;
    border-radius: 50%;
    box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .25), 0 2px 4px rgba(0, 0, 0, .35);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    line-height: 1;
    transition: transform .15s;
  }
  .pieza.b, .pieza.B { background: var(--blanca); color: #b8860b; }
  .pieza.n, .pieza.N { background: var(--negra); color: #f5bd2e; }
  .pieza.B::after, .pieza.N::after { content: '♛'; display: inline-block; }
  .tablero.girado .pieza::after { transform: rotate(180deg); }
  .pieza.puede { box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .25), 0 0 0 3px rgba(245, 189, 46, .65); }
  .pieza.elegida { transform: scale(1.1); box-shadow: 0 0 0 4px var(--sel), 0 6px 10px rgba(0, 0, 0, .4); }
  .pieza.comida { opacity: .35; }
  .destino::after {
    content: '';
    position: absolute;
    inset: 34%;
    border-radius: 50%;
    background: var(--sel);
    opacity: .85;
  }
  .boton.secundario { flex: .8; white-space: nowrap; font-size: 15px; }
  .ayuda { text-align: center; font-size: 13px; color: var(--suave); margin-top: -6px; }

  /* Que el tablero no se encoja si la pantalla es baja */
  .tablero { flex: none; }
  .casillero .nombre i { box-shadow: 0 0 0 1.5px var(--suave); }
</style>
</head>
<body>
<main>
  <div class="barra">
    <a class="volver" href="index.html">‹ Menú</a>
    <h1>Damas</h1>
    <span></span>
  </div>

  <div class="segmentos" id="modos">
    <button data-valor="movil">Contra el móvil</button>
    <button data-valor="dos">2 en un móvil</button>
    <button data-valor="cerca">2 móviles</button>
  </div>

  <div class="segmentos" id="dificultades">
    <button data-valor="facil">Fácil</button>
    <button data-valor="normal">Normal</button>
    <button data-valor="dificil">Difícil</button>
  </div>

  <div id="marcador"></div>
  <div class="estado" id="estado"></div>

  <div class="tablero" id="tablero"></div>
  <div class="ayuda">Comer es obligatorio, y hay que comer el máximo de piezas. Las damas vuelan.</div>

  <div class="acciones">
    <button class="boton" id="nueva">Nueva partida</button>
    <button class="boton secundario" id="borrar">Borrar marcador</button>
  </div>
</main>

<script src="plataforma.js"></script>
<script src="cerca.js"></script>
<script src="damas.js"></script>
<script src="damas-interfaz.js"></script>
</body>
</html>
