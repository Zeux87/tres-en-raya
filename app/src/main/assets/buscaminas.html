<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Buscaminas</title>
<link rel="stylesheet" href="comun.css">
<style>
  :root {
    --cerrada: #b9c6d6;
    --cerrada-borde: #9aabc0;
    --abierta: #eef1f5;
    --n1: #2d6cdf; --n2: #2a9a4b; --n3: #e0433f; --n4: #5a3fc0;
    --n5: #a0461b; --n6: #11908a; --n7: #333; --n8: #777;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --cerrada: #3b4458;
      --cerrada-borde: #2c3344;
      --abierta: #1c1b23;
      --n1: #6da2ff; --n2: #5fd37f; --n3: #ff6e6a; --n4: #a996ff;
      --n5: #f39a62; --n6: #4fd8cf; --n7: #ddd; --n8: #aaa;
    }
  }
  .panel {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    background: var(--tarjeta);
    border-radius: 14px;
    padding: 8px 14px;
    box-shadow: var(--sombra);
    font-weight: 800;
    font-size: 20px;
  }
  .panel .der { text-align: right; }
  #cara {
    border: 0;
    background: var(--fondo);
    border-radius: 12px;
    font-size: 26px;
    width: 46px;
    height: 46px;
    line-height: 1;
  }
  #cara:active { transform: scale(.94); }

  .tablero {
    display: grid;
    gap: 3px;
    touch-action: manipulation;
    -webkit-touch-callout: none;
  }
  .casilla {
    aspect-ratio: 1;
    border-radius: 5px;
    background: var(--cerrada);
    box-shadow: inset 0 -3px 0 var(--cerrada-borde);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: var(--letra, 17px);
    line-height: 1;
  }
  .casilla.abierta { background: var(--abierta); box-shadow: none; }
  .casilla.mina { background: var(--abierta); }
  .casilla.explotada { background: #ef5b5b; }
  .casilla.fallo { background: var(--abierta); text-decoration: line-through; opacity: .7; }
  .n1 { color: var(--n1); } .n2 { color: var(--n2); } .n3 { color: var(--n3); } .n4 { color: var(--n4); }
  .n5 { color: var(--n5); } .n6 { color: var(--n6); } .n7 { color: var(--n7); } .n8 { color: var(--n8); }
  .casilla.pulsada { filter: brightness(.9); }

  #estado { text-align: center; font-size: 17px; font-weight: 700; min-height: 24px; }
  #estado.gana { color: #2a9a4b; }
  #estado.pierde { color: #ef5b5b; }
  #record { text-align: center; font-size: 14px; color: var(--suave); margin-top: -8px; }

  #herramienta button { font-size: 15px; padding: 8px 6px; }
  main > * { flex-shrink: 0; }
</style>
</head>
<body>
<main>
  <div class="barra">
    <a class="volver" href="index.html">‹ Menú</a>
    <h1>Buscaminas</h1>
    <span></span>
  </div>

  <div class="segmentos" id="niveles">
    <button data-nivel="facil">Fácil</button>
    <button data-nivel="normal">Normal</button>
    <button data-nivel="dificil">Difícil</button>
  </div>

  <div class="panel">
    <span id="quedan">💣 0</span>
    <button id="cara" aria-label="Nueva partida">🙂</button>
    <span class="der" id="reloj">⏱ 0</span>
  </div>

  <div class="segmentos" id="herramienta">
    <button data-modo="abrir">⛏️ Descubrir</button>
    <button data-modo="bandera">🚩 Bandera</button>
  </div>

  <div class="tablero" id="tablero"></div>

  <div id="estado"></div>
  <div id="record"></div>

</main>

<script src="plataforma.js"></script>
<script src="buscaminas.js"></script>
<script src="buscaminas-interfaz.js"></script>
</body>
</html>
