plugins {
    id 'com.android.application'
}

// GitHub Actions pasa -PcodigoVersion=<número de compilación>; en local vale 1
def codigo = (project.findProperty('codigoVersion') ?: '1').toString().toInteger()

android {
    namespace 'es.pablo.tresenraya'
    compileSdk 34

    defaultConfig {
        applicationId 'es.pablo.tresenraya'
        minSdk 27
        targetSdk 34
        versionCode codigo
        versionName "1.0.${codigo}"
    }

    // Misma firma siempre, para que cada APK nuevo se instale encima del anterior.
    // La clave NO está en el repo: se lee de variables de entorno (GitHub Actions
    // las rellena desde los secrets) o de ~/.gradle/gradle.properties en local.
    def firma = { String nombre -> System.getenv(nombre) ?: project.findProperty(nombre) }
    def almacen = firma('FIRMA_ALMACEN')
    def hayFirma = almacen && file(almacen).exists()

    signingConfigs {
        if (hayFirma) {
            release {
                storeFile file(almacen)
                storePassword firma('FIRMA_CLAVE_ALMACEN')
                keyAlias firma('FIRMA_ALIAS')
                keyPassword firma('FIRMA_CLAVE')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Sin clave (p. ej. en local) el APK de release sale sin firmar
            if (hayFirma) signingConfig signingConfigs.release
        }
        debug {
            // Sin clave se usa la firma de depuración por defecto de Android
            if (hayFirma) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
